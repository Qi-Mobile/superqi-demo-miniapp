<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sample Miniapp</title>
    <script src="/common/main.js"></script>
    <script src="https://cdn.marmot-cloud.com/npm/hylid-bridge/2.10.0/index.js"></script>
    <link rel="stylesheet" href="/common/style.css">
</head>

<body>
    <div class="flex flex-col w-full h-full min-h-full">
        <miniapp-header></miniapp-header>

        <p class="text-sm text-gray-500 p-4">
            This page reads the query params it was opened with (e.g. via a deeplink) and displays them below.
        </p>

        <div class="flex flex-col gap-3 mb-4 px-4">
            <div class="text-sm font-medium">Received params</div>
            <div id="paramsList" class="border border-gray-300 rounded-md divide-y divide-gray-200"></div>

            <button onclick="readStartupParams()"
                class="bg-yellow-400 text-white px-4 py-2 font-bold w-full rounded-md">Read my.getStartupParams</button>
        </div>

        <section id="content" class="flex-1 flex-grow mt-4 flex flex-col items-start p-4">
            <miniapp-console class="w-full h-full"></miniapp-console>
        </section>
    </div>
</body>

<script>
    function renderQueryParams() {
        const params = new URLSearchParams(window.location.search);
        const container = document.getElementById('paramsList');

        console.log('[receiver] location.href: ' + window.location.href);
        console.log('[receiver] location.search: ' + (window.location.search || '(empty)'));

        if ([...params].length === 0) {
            container.innerHTML = '<div class="px-3 py-2 text-sm text-gray-500">No query params received</div>';
            return;
        }

        container.innerHTML = [...params].map(([key, value]) =>
            `<div class="px-3 py-2 text-sm flex justify-between gap-2">
                <span class="font-medium">${key}</span>
                <span class="text-gray-600 break-all">${value}</span>
            </div>`
        ).join('');

        params.forEach((value, key) => {
            console.log('[receiver] param ' + key + ' = ' + value);
        });
    }

    function readStartupParams() {
        if (!window.my || !my.getStartupParams) {
            console.warn('[receiver] my.getStartupParams is not available in this container');
            return;
        }

        my.getStartupParams({
            success: (res) => {
                console.log('[receiver] getStartupParams success:', res);
            },
            fail: (err) => {
                console.error('[receiver] getStartupParams fail:', err);
            }
        });
    }

    window.addEventListener('load', renderQueryParams);
</script>

</html>
